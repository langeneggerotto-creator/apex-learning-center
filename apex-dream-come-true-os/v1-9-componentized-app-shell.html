<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX Dream OS v1.9</title><style>body{margin:0;background:#06101e;color:#f8fafc;font-family:system-ui}.app{max-width:460px;margin:auto;padding:16px}.card{background:#0e1b31;border:1px solid #2b4263;border-radius:20px;padding:16px;margin:12px 0}.pill{display:inline-block;border:1px solid #2b4263;border-radius:999px;padding:7px 9px;margin:3px;font-size:12px}textarea,input,select{width:100%;border-radius:14px;border:1px solid #2b4263;background:#030b16;color:#f8fafc;padding:12px;box-sizing:border-box}textarea{min-height:100px}button{width:100%;border:0;border-radius:14px;padding:13px;margin-top:9px;font-weight:800;background:#dbeafe;color:#06101e}.tab{width:auto}.box{background:#061426;border:1px solid #2b4263;border-radius:14px;padding:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}pre{white-space:pre-wrap;background:#020812;border-radius:14px;padding:10px}</style></head><body><main class="app" id="app"></main><script>const state={screen:'intake',mode:'guardian',dream:'I want to visit the Denver Broncos and meet the team.',context:'Needs guardian approval before any outreach.',pathway:null};const app=document.getElementById('app');function esc(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function make(){const minor=state.mode==='guardian'||/child|guardian|minor/i.test(state.context+state.dream);state.pathway={dream:state.dream,mode:state.mode,truth_status:'LOCAL_DRAFT_NOT_SUBMITTED',external_outreach:'DISABLED',first_actions:['Create a privacy-safe Dream Card.','Pick one first step for this week.','Research official resources manually.',minor?'Get adult approval before sharing.':'Review before optional outreach.'],swot:{strengths:'Clear dream and emotional motivation.',blockers:minor?'Approval and privacy required.':'Needs sequencing and first milestone.',opportunities:'Official channels, mentors, nonprofits, community support.',risks:'False hope, privacy exposure, unverified contacts.'},gate:minor?'BLOCKED until adult approval.':'NO-SEND: drafts only.'};state.screen='path';render()}function nav(){return '<p><button class="tab" onclick="state.screen=\'intake\';render()">Dream</button> <button class="tab" onclick="state.screen=\'path\';render()">Path</button> <button class="tab" onclick="state.screen=\'swot\';render()">SWOT</button> <button class="tab" onclick="state.screen=\'gate\';render()">Gate</button> <button class="tab" onclick="state.screen=\'json\';render()">JSON</button></p>'}function header(){return '<span class="pill">DREAM-FIRST</span><span class="pill">NO-SEND</span><span class="pill">NOT VALIDATED</span>'}function render(){const p=state.pathway;if(state.screen==='intake')app.innerHTML=header()+'<h1>Build the dream into a pathway.</h1><div class="card"><label>Mode</label><select id="m"><option value="guardian">Guardian</option><option value="adult">Adult</option><option value="accessibility">Accessibility</option></select><label>Dream</label><textarea id="d">'+esc(state.dream)+'</textarea><label>Context</label><input id="c" value="'+esc(state.context)+'"><button onclick="state.mode=m.value;state.dream=d.value;state.context=c.value;make()">Build my first pathway</button></div>'+nav();else if(state.screen==='path')app.innerHTML=header()+'<h1>Dream Pathway</h1><div class="card"><h2>'+esc(p.dream)+'</h2><ol>'+p.first_actions.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ol></div>'+nav();else if(state.screen==='swot')app.innerHTML=header()+'<h1>SWOT</h1><div class="grid">'+Object.entries(p.swot).map(([k,v])=>'<div class="box"><b>'+k+'</b><br>'+esc(v)+'</div>').join('')+'</div>'+nav();else if(state.screen==='gate')app.innerHTML=header()+'<h1>Gate</h1><div class="card"><b>'+esc(p.gate)+'</b><p>External outreach: '+p.external_outreach+'</p></div>'+nav();else app.innerHTML=header()+'<h1>Local JSON</h1><pre>'+esc(JSON.stringify(p,null,2))+'</pre>'+nav()}render()</script></body></html>
